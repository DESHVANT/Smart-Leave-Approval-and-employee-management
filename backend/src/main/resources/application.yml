spring:
  datasource:
    url: jdbc:h2:mem:smartleave;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: never

server:
  port: 8080

logging:
  level:
    com.smartleave: INFO
    org.springframework.security: WARN

app:
  jwt:
    secret: smartleave-assessment-secret-key-2026-smartleave-assessment-secret-key-2026
    expiration-ms: 86400000