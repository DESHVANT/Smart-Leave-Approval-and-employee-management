services:
  mysql:
    image: mysql:8.4
    container_name: smartleave-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: smartleave
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
